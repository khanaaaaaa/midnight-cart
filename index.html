<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>midnight cart</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page">
            <header>
                <p class="tiny">♡ wish list ♡</p>
                <h1>midnight cart</h1>
                <p class="subtitle">its not a want, its a need</p>
            </header>
            <nav class="categories">
                <a href="#accessories">accessories</a>
                <a href="#cosplays">cosplays</a>
            </nav>
            <section id="accessories" class="wishlist-section">
                <div class="section-heading">
                    <span>01</span>
                    <h2>accessories</h2>
                </div>
                <p class="section-description">
                    little things i would love to have.
                </p>
                <div class="items">
                    <div class="item">
                        <div class="image-box">
                            <img src="products/1.png" alt="Accessory">
                        </div>
                        <div class="info">
                            <p class="category">ACCESSORY #001</p>
                            <h3>flower hair clip</h3>
                            <p class="description">
                                want to cosplay mitsuri with this hair decor
                            </p>
                            <div class="bottom">
                                <a 
                                    href="https://s.daraz.com.np/s.Zm0Dg?cc"
                                    target="_blank"
                                    class="daraz"
                                >
                                    VIEW ↗
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
